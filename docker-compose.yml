version: '3.9'

services:
  app:
    build: .
    container_name: codefolio_app
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/codeFolioDB
    depends_on:
      - mongo
    command: npm run dev

  mongo:
    image: mongo:7
    container_name: codefolio_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: codefolioDB
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: